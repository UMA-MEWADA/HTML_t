<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        .box {
            height: 70px;
            width: 70px;
            margin: 10px;
            padding: 5px;
            border: 2px solid black ;
            background-color: plum;
           position: relative;
           top: 10px;
           left: 10px;
        }
           #box1{
           animation-name: ghumakkad;
           animation-duration: 2s;
           animation-timing-function: ease-in-out;
           animation-delay: 1s;
           animation-iteration-count: infinite;
           animation-direction: alternate;
           /* animation: ghunakkad 2s ease-in-out 0s 4 alternate; */ 
           
        }
        #box2{
             animation: ghumakkad2 2s ease-in-out 1s infinite alternate-reverse; 
        }
        @keyframes ghumakkad {
            from {
                left: 10px;
            }
            to{
                left: 400px;
            }
        }
        @keyframes ghumakkad2 {
          0% {left: 10px; top: 0px;}
          50% {letf: 150px; top: 100px;}
          65% {letf: 200px; top: 150px;}
          100% {left: 300px; top: 0px;}
        }
    </style>
</head>
<body>
    <div id="box1" class="box">Animate</div>
        <div id="box2" class="box">Animate</div>
</body>
</html>
