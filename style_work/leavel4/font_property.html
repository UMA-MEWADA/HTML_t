<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Size</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playwrite+NZ+Guides&display=swap" rel="stylesheet">
    <style>
        #first {
          font-size: 10px;
          font-weight: 100;
          font-style: italic;
        }
        #second {
            font-size: medium;
            font-weight: 900;
            font-style: oblique;
             font-family: "Playwrite NZ Guides", cursive;


        }
        #third{
            font-size: 25px;
            font-weight: 200;
            font-style: normal;
            
        }
        #fourth{
            font-size: 35px;
            font-weight: 900;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        }
    </style>
</head>
<body>
    <p id="first">Sets of the font in web content</p>
    <p id="second">Sets of the font in web content</p>
    <p id="third">Sets of the font in web content</p>
    <p id="fourth">Sets of the font in web content</p>
</body>
</html>
