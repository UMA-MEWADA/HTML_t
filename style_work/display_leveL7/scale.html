<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scale</title>
     <style>
        .box {
            height: 50px;
            width: 50px;
            margin: 20px;
            padding: 5px;
            border: 2px solid black;
            background-color: plum;
            position: relative;
            top: 50px;
            left: 50px;
            transition: all 1s ease-in;
        }
        
        
        #box1 {
            background-color: lime;
        }
        #box1:hover {
             transform: scale(2);
             background-color: blue;
            }
        #box2 { 
            background-color: blueviolet;
        }
       
         #box2:hover {
            transform: scale3d(5);
            background-color: rgb(0, 255, 234);
        }
         #box3 {
            background-color: indianred;
        }
          #box3:hover { 
            transform: scaleX(0.5);
            background-color: blue;
        }
          #box4 {
            background-color: rgb(231, 177, 18);
        }
           #box4:hover {
             transform: scaley(2);
             background-color: blue;
            }

    </style>
</head>
<body>
    <div id="box1" class="box">scale</div>
    <div id="box2" class="box">scale 3d</div>
    <div id="box3" class="box">x scale half</div>
    <div id="box4" class="box">y scale</div>
    
</body>
</html>
