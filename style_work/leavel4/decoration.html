<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Decoration</title>
    <style>
        #head{
            background-color: yellowgreen;
            text-decoration: underline;
            text-transform: uppercase;
        }
        #link{
            text-decoration: none;
        }
        .box{
            text-decoration: underline;
        }
        #box1 { 
            text-decoration-style: dashed;
         text-decoration-color: blueviolet;
         text-transform: initial;

        }
       #box2{
            text-decoration-style: double;
            text-decoration-color: brown;
        }
        #box3 {
            text-decoration-style: wavy;
            text-decoration-color: rgb(13, 9, 234);
        }
        #box4 {
            text-decoration-style: solid;
        }
    </style>
</head>
<body>
    <h1 id="head">this is my text</h1>
    <a id="link" href="#">This is a link </a>
    <h3 id="box1" class="box">Box1</h3>
    <h3 id="box2" class="box">Box2</h3>
    <h3 id="box3" class="box">Box3</h3>
    <h3 id="box4" class="box">Box4</h3>

</body>
</html>
