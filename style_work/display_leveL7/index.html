<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo classes</title>
    <style>
        .pseudo {
           height: 25px;
           width: 150px;
           background-color: forestgreen;
           border: 2px solid black;
           border-radius: 10px;
           transition-property: all;
           transition-duration: 1s;
           transition-timing-function: ease-in-out;
           transition-delay: 0s;
           /* transition: all 1s ease-in-out; tino ek sath bhi define kr sakte hai */
        }
        .pseudo:hover {
           height: 25px;
           width: 150px;
           background-color:  lightcoral;
          
        }
        .pseudo:active {
             height: 25px;
           width: 150px;
           background-color: rgb(239, 19, 19);
           border: 2px solid blue;

        }
    </style>
</head>
<body>
    <button class="pseudo">Learning Pseudo</button>
</body>
</html>
