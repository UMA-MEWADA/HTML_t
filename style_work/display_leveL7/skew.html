<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
        .box {
            height: 50px;
            width: 50px;
            margin: 20px;
            padding: 5px;
            border: 2px solid black;
            background-color: plum;
            position: relative;
            top: 50px;
            left: 50px;
            transition: all 1s ease-in;
        }
        
        
        #box1 {
            background-color: lime;
        }
        #box1:hover {
             transform: skew(45deg); 
             background-color: blue;
            }
        #box2 { 
            background-color: blueviolet;
        }
       
         #box2:hover {
            transform: skew(180deg);
            background-color: rgb(0, 255, 234);
        }
         #box3 {
            background-color: indianred;
        }
          #box3:hover { 
            transform: skew(245deg);
            background-color: rgb(9, 174, 122);
        }
          #box4 {
            background-color: rgb(231, 177, 18);
        }
           #box4:hover {
             transform: skew(90deg);
             background-color: rgb(255, 0, 153);
            }

    </style>
</head>
<body>
    <div id="box1" class="box">skew 45 deg</div>
    <div id="box2" class="box"> skew 180 deg</div>
    <div id="box3" class="box">Skew 245 deg</div>
    <div id="box4" class="box"> Skew 90 deg</div>
    
</body>
</html>
